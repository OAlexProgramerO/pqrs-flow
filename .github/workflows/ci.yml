name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install root tooling
        run: npm ci

      - name: Install backend dependencies
        id: backend
        run: npm --prefix backend ci

      # The three checks below always run, so one red build shows every problem at once
      # instead of hiding the tests behind a formatting error.
      - name: Lint
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: |
          npm run format:check || {
            echo "::error title=Formatting::Run 'npm run format' on your computer and commit the result."
            exit 1
          }

      - name: Run tests
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: npm test

      - name: Run coverage report
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: npm run test:coverage

      - name: Install Playwright browsers
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: cd backend && npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        id: e2e
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: npm run test:e2e

      - name: Run accessibility checks
        id: a11y
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: npm run test:a11y

      - name: Upload browser and coverage artifacts
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.a11y.outcome == 'success' || steps.backend.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts-node-${{ matrix.node-version }}
          path: |
            backend/coverage/
            backend/playwright-report/
            backend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm --prefix backend ci --omit=dev

      - name: Audit
        run: npm --prefix backend audit --omit=dev --audit-level=high

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag pqrs-flow:ci .

      - name: Start container with isolated persistent volumes
        run: |
          docker volume create pqrs-flow-ci-data
          docker volume create pqrs-flow-ci-attachments
          docker run --detach --name pqrs-flow-ci \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env DB_PATH=data/pqrs.db \
            --env ATTACHMENTS_STORAGE_DIR=data/attachments \
            --env SESSION_COOKIE_SECURE=false \
            --volume pqrs-flow-ci-data:/app/data \
            --volume pqrs-flow-ci-attachments:/app/data/attachments \
            pqrs-flow:ci

      - name: Wait for health and exercise database initialization
        run: |
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' pqrs-flow-ci 2>/dev/null)" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' pqrs-flow-ci)" = "healthy"
          curl --fail --silent http://127.0.0.1:3000/api/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:3000/api/pqrs)
          test "$status" = "400"
          docker run --rm --volume pqrs-flow-ci-data:/data \
            --entrypoint node pqrs-flow:ci \
            -e "const fs=require('fs');if(!fs.existsSync('/data/pqrs.db'))process.exit(1)"

      - name: Restart and verify persisted database
        run: |
          docker restart pqrs-flow-ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' pqrs-flow-ci)" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Health.Status}}' pqrs-flow-ci)" = "healthy"
          docker run --rm --volume pqrs-flow-ci-data:/data \
            --entrypoint node pqrs-flow:ci \
            -e "const fs=require('fs');if(!fs.existsSync('/data/pqrs.db'))process.exit(1)"

      - name: Clean up test container and volumes
        if: always()
        run: |
          docker rm --force pqrs-flow-ci || true
          docker volume rm pqrs-flow-ci-data pqrs-flow-ci-attachments || true
