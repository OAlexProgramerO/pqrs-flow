services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pqrs-flow:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_PATH: data/pqrs.db
      ATTACHMENTS_STORAGE_DIR: data/attachments
      # Keep this false for direct local access. Enable only when HTTPS is correctly
      # terminated in front of the application.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # Optional values are read by the existing application configuration.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
      EMAIL_RETRY_INITIAL_DELAY_MS: ${EMAIL_RETRY_INITIAL_DELAY_MS:-30000}
      EMAIL_RETRY_MAX_DELAY_MS: ${EMAIL_RETRY_MAX_DELAY_MS:-1800000}
      EMAIL_WORKER_INTERVAL_MS: ${EMAIL_WORKER_INTERVAL_MS:-60000}
      EMAIL_BATCH_SIZE: ${EMAIL_BATCH_SIZE:-20}
      EMAIL_DELIVERY_TIMEOUT_MS: ${EMAIL_DELIVERY_TIMEOUT_MS:-30000}
      EMAIL_PROCESSING_LEASE_MS: ${EMAIL_PROCESSING_LEASE_MS:-60000}
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    volumes:
      - pqrs_flow_database:/app/data
      - pqrs_flow_attachments:/app/data/attachments
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 20s

volumes:
  pqrs_flow_database:
  pqrs_flow_attachments:
